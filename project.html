<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="주상혁 포트폴리오 프로젝트 상세">
<title>Project Detail — 주상혁 포트폴리오</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="diagram-overhaul.css?v=colors3">
<link rel="stylesheet" href="layout-recovery.css">
<style>
.project-page-intro{max-width:1320px;margin:0 auto;padding:64px 7vw 18px}
.project-page-intro .eyebrow{margin-bottom:14px}
.project-page-intro h1{margin:0;font-size:clamp(30px,4vw,52px);line-height:1.15;letter-spacing:-.055em}
.project-page-intro p{margin:16px 0 0;color:var(--muted);font-size:14px}
.project-page-content{padding:24px 7vw 100px;max-width:none}
.project-page-content .project-detail{max-width:1320px;margin:0 auto}
.project-page-back{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:10px 'DM Mono',monospace;letter-spacing:.05em;transition:background .2s,color .2s,border-color .2s}
.project-page-back:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.project-page-content .project-actions{margin:0 0 24px}
.project-page-content .project-actions .detail-link{display:none}
@media(max-width:600px){.project-page-intro{padding:42px 6vw 14px}.project-page-content{padding:18px 5vw 64px}.site-header{padding:0 5vw}.site-header nav{gap:12px;font-size:9px}}
</style>
</head>
<body data-project-detail="true">
<header class="site-header">
  <a class="brand" href="index.html#top">JUSANGHYEOK<span>.</span></a>
  <nav aria-label="메인 메뉴">
    <a href="index.html#about">About</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#method">Method</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
<main>
  <section class="project-page-intro">
    <div class="eyebrow">SELECTED WORK · PROJECT DETAIL</div>
    <h1>프로젝트를 자세히 살펴봅니다.</h1>
    <p>메인 포트폴리오와 같은 디자인 시스템으로 문제, 해결 방식, 아키텍처와 데이터 흐름을 정리했습니다.</p>
    <a class="project-page-back" id="backToProjects" href="index.html#projects">← 전체 프로젝트로 돌아가기</a>
  </section>
  <section class="section project-page-content">
    <div id="projectDetail" class="project-detail"></div>
  </section>
</main>
<footer><span>JUSANGHYEOK</span><span>© 2026</span></footer>
<script src="script.js"></script>
<script src="project-links.js"></script>
<script>
(function(){
  const key = new URLSearchParams(location.search).get('project') || 'smart';
  const valid = ['swing','game','ems','smart','meet'];
  const selected = valid.includes(key) ? key : 'smart';
  document.getElementById('backToProjects').href = 'index.html?project=' + encodeURIComponent(selected) + '#projects';
})();
</script>
</body>
</html>
